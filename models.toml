# Declarative model profiles & 64 GB Apple Silicon hardware budget for agentic-playground.
# Model rationale, alternatives, and live evaluation log: see models.md
# Cloud profiles are disabled by default (enabled = false, is_cloud = true) to prevent accidental spend.

default_profile = "workhorse"

[hardware]
unified_memory_gb = 64.0
safe_wired_ceiling_gb = 46.0
max_loaded_models = 3
coresident_roles = ["workhorse", "fast", "embed"]

[profiles.workhorse]
role = "workhorse"
provider = "ollama"
base_url = "http://localhost:11434/v1"
native_base_url = "http://localhost:11434"
model = "qwen3.8:27b"
api_style = "openai_compat"
num_ctx = 32768
keep_alive = "30m"
temperature = 0.1
est_ram_gb = 22.0
is_cloud = false
enabled = true

[profiles."bonsai-2.5"]
role = "bonsai-2.5"
provider = "lmstudio"
