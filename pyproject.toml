[project]
name = "harness-lab"
version = "0.1.0"
description = "Glass-box agentic harness lab comparing framework-free Track A and PydanticAI v2 Track B on 64 GB Apple Silicon"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "rich>=15.0.0",
]

[project.scripts]
lab = "harness_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<1.0.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests requiring a running local or cloud LLM runtime (skipped by default)",
]
addopts = "-m 'not live'"
